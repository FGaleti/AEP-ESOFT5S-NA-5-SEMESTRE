# ─── OBSERVAÇÃO SPRING BOOT ───
# Aplicação de Ouvidoria Digital - ODS 16

# Server Configuration
server.port=8080
server.servlet.context-path=/observacao

# Application Name
spring.application.name=observacao-spring-boot

# ─── DATABASE CONFIGURATION (H2 - In-Memory) ───
spring.datasource.url=jdbc:h2:mem:observacao_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA/Hibernate Configuration ───
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ─── H2 CONSOLE (para debug) ───
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── LOGGING ───
logging.level.root=INFO
logging.level.com.observaacao=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ─── JACKSON (JSON) ───
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt_BR

# ─── ERROR HANDLING ───
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
